name: Release

# Builds a signed APK and the desktop distributions, and publishes them as a GitHub release. Started
# by hand, from the Actions tab ("Run workflow") or with `gh workflow run release.yml`.
#
# The APK is signed with the release key, given through the repository's secrets:
#   RELEASE_KEYSTORE_BASE64    the keystore, as base64 (`base64 -w0 release.jks`)
#   RELEASE_KEYSTORE_PASSWORD  the keystore's password
#   RELEASE_KEY_ALIAS          the key's alias
#   RELEASE_KEY_PASSWORD       the key's password
# They're written to local.properties, which androidApp/build.gradle reads them from. The desktop
# distributions aren't signed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (v<version> when empty)"
        type: string
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create as a draft (published by hand afterwards)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    # As androidApp/build.gradle names its versions (yyyy.Mdd.0, in UTC on the runners), so that the
    # APK and the desktop distributions share one.
    - name: Name the version
      id: version
      env:
        TAG: ${{ inputs.tag }}
      run: |
        version="$(date -u +%Y).$(date -u +%-m%d).0"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG:-v$version}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Verktex, the engine.
        submodules: true

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    # Without the secrets, the APK would be unsigned.
    - name: Set up the release key
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "::error::The release key's secrets aren't set (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)."
          exit 1
        fi
        keystore="$RUNNER_TEMP/release.jks"
        # Spaces and line breaks a paste may add aren't base64.
        if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2> /dev/null; then
          echo "::error::RELEASE_KEYSTORE_BASE64 isn't valid base64: set it again to the output of 'base64 -w0 release.jks'."
          exit 1
        fi
        if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
          echo "::error::The keystore couldn't be opened with RELEASE_KEYSTORE_PASSWORD, or has no key named RELEASE_KEY_ALIAS."
          exit 1
        fi
        {
          echo "sdk.dir=$ANDROID_HOME"
          echo "RELEASE_KEYSTORE=$keystore"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
        } > local.properties

    - name: Assemble the APK
      run: ./gradlew :androidApp:assembleRelease

    - name: Name the APK
      run: |
        mkdir -p dist
        apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -n1)
        cp "$apk" "dist/osudroid-reci-${{ needs.version.outputs.version }}-android.apk"

    - name: Check the APK's signature
      run: |
        apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
        "$apksigner" verify --print-certs dist/*.apk

    - name: Remove the release key
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks" local.properties verktex/local.properties

    - name: Upload the APK
      uses: actions/upload-artifact@v7
      with:
        name: android
        path: dist/*.apk
        if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux-x64
          runner: ubuntu-latest
        - platform: windows-x64
          runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Verktex, the engine.
        submodules: true

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    # The Vulkan backend's library builds against the NDK's Vulkan headers and jni.h, and its shaders
    # compile with its glslc: Linux x64 only so far, other platforms run on OpenGL.
    - name: Install the NDK
      if: matrix.platform == 'linux-x64'
      # sdkmanager stops reading the licenses' answers when it's done, which ends yes with a broken
      # pipe: the job's shell has pipefail, so that isn't an error.
      run: (yes 2> /dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;22.1.7171670" > /dev/null

    # A zip with the game, its libraries, FFmpeg's for this platform and the start scripts
    # (bin/osudroid-reci, bin/osudroid-reci.bat). It runs on a Java 17 runtime.
    - name: Build the distribution
      run: >
        ./gradlew :desktopApp:distZip
        -PdesktopVersion=${{ needs.version.outputs.version }}
        -PdesktopBuildType=release

    - name: Check the Vulkan library was bundled
      if: matrix.platform == 'linux-x64'
      run: unzip -p desktopApp/build/distributions/osudroid-reci.zip osudroid-reci/lib/desktop-natives.jar > "$RUNNER_TEMP/natives.jar" && unzip -l "$RUNNER_TEMP/natives.jar" | grep natives/linux-x64/libverktex_vulkan.so

    - name: Name the distribution
      run: |
        mkdir -p dist
        cp desktopApp/build/distributions/osudroid-reci.zip "dist/osudroid-reci-${{ needs.version.outputs.version }}-desktop-${{ matrix.platform }}.zip"

    - name: Upload the distribution
      uses: actions/upload-artifact@v7
      with:
        name: desktop-${{ matrix.platform }}
        path: dist/*.zip
        if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [ version, android, desktop ]
    permissions:
      contents: write
    steps:
    - name: Download the builds
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.version.outputs.tag }}
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        flags=()
        [ "${{ inputs.prerelease }}" = "true" ] && flags+=(--prerelease)
        [ "${{ inputs.draft }}" = "true" ] && flags+=(--draft)
        gh release create "$TAG" dist/* \
          --target "$GITHUB_SHA" \
          --title "osu!droid-reci $VERSION" \
          --generate-notes \
          "${flags[@]}"
